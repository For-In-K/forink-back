- name: Debug SSH Key Setup and known_hosts
  run: |
    set -eux  # 명령어 출력 + 에러 시 중단 + 변수 확장 오류 시 중단

    mkdir -p ~/.ssh

    echo ">>> SSH key from secret (first 50 chars):"
    echo "${{ secrets.EC2_SSH_KEY }}" | head -c 50
    echo

    echo ">>> Writing SSH key to ~/.ssh/key.pem"
    cat <<EOF > ~/.ssh/key.pem
${{ secrets.EC2_SSH_KEY }}
EOF

    echo ">>> Permissions for ~/.ssh/key.pem"
    ls -l ~/.ssh/key.pem

    echo ">>> Showing first 5 lines of key.pem"
    head -5 ~/.ssh/key.pem

    chmod 600 ~/.ssh/key.pem

    echo ">>> ssh-keyscan to known_hosts"
    ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    echo ">>> known_hosts content:"
    cat ~/.ssh/known_hosts

    echo ">>> Testing SSH connection with verbose output"
    ssh -vvv -i ~/.ssh/key.pem -o StrictHostKeyChecking=yes ec2-user@${{ secrets.EC2_HOST }} "echo SSH 연결 성공!"

