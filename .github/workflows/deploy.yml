name: Build and Deploy ForinK Backend Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17 (Corretto)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build project with Gradle
        run: ./gradlew clean build -x test

      - name: Setup SSH private key and known_hosts (with debug)
        run: |
          set -eux
          mkdir -p ~/.ssh

          echo ">>> SSH key first 50 chars:"
          echo "${{ secrets.EC2_SSH_KEY }}" | head -c 50
          echo

          echo ">>> Write SSH key to ~/.ssh/key.pem"
          cat <<EOF > ~/.ssh/key.pem
${{ secrets.EC2_SSH_KEY }}
EOF

          echo ">>> ~/.ssh/key.pem permission & first 5 lines:"
          ls -l ~/.ssh/key.pem
          head -5 ~/.ssh/key.pem

          chmod 600 ~/.ssh/key.pem

          echo ">>> ssh-keyscan output:"
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          echo ">>> ~/.ssh/known_hosts content:"
          cat ~/.ssh/known_hosts

      - name: Copy built JAR file to EC2
        run: |
          scp -i ~/.ssh/key.pem build/libs/*.jar ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/forink-back/

      - name: Restart backend service on EC2
        run: |
          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=yes ec2-user@${{ secrets.EC2_HOST }} sudo systemctl restart forink-backend

