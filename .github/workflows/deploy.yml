name: Build and Deploy Forink Back Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build project with Gradle
        run: ./gradlew clean build -x test

      - name: Add SSH private key to the agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy built JAR file to EC2
        run: scp build/libs/*.jar ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/forink-back/

      - name: Restart backend service on EC2
        run: ssh ec2-user@${{ secrets.EC2_HOST }} sudo systemctl restart forink-backend
